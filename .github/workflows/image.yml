name: Build images

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      ref:
        description: Exact Git ref to build
        required: true
        type: string
      publish:
        description: Publish immutable images to GHCR
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  packages: write

concurrency:
  group: search-x-image-${{ inputs.ref || github.sha }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      sha: ${{ steps.revision.outputs.sha }}
      short_sha: ${{ steps.revision.outputs.short_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 1
      - id: revision
        shell: bash
        run: |
          sha=$(git rev-parse HEAD)
          printf 'sha=%s\n' "$sha" >> "$GITHUB_OUTPUT"
          printf 'short_sha=%s\n' "${sha:0:12}" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.work
          cache-dependency-path: |
            runtime/go.sum
            websearch/go.sum
            webfetch/go.sum
      - name: Run canonical checks
        run: make check

  build:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        service: [websearch, webfetch]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.sha }}
          fetch-depth: 1
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Log in to GHCR
        if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || inputs.publish }}
        uses: docker/login-action@c99871dec2022cc055c062a10cc1a1310835ceb4 # v4.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: image
        name: Build immutable image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ${{ matrix.service }}/Dockerfile
          platforms: linux/amd64
          push: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || inputs.publish }}
          tags: ghcr.io/zoeimport/search-x-${{ matrix.service }}:sha-${{ needs.verify.outputs.short_sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/ZoeImport/search-x
            org.opencontainers.image.revision=${{ needs.verify.outputs.sha }}
          provenance: false
      - name: Record image
        shell: bash
        run: |
          {
            printf 'service=%s\n' '${{ matrix.service }}'
            printf 'source_sha=%s\n' '${{ needs.verify.outputs.sha }}'
            printf 'image=ghcr.io/zoeimport/search-x-%s:sha-%s\n' '${{ matrix.service }}' '${{ needs.verify.outputs.short_sha }}'
            printf 'digest=%s\n' '${{ steps.image.outputs.digest }}'
          } >> "$GITHUB_STEP_SUMMARY"
