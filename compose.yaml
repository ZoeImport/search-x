services:
  search-api:
    build: .
    user: "0:0"
    environment:
      SEARCH_ADDR: ":8080"
      SEARCH_TRACE_ENABLED: "true"
      SEARCH_TRACE_ROOT: /data/trace
      SEARCH_TRACE_FAILURE_MODE: strict
      SEARCH_DEBUG_DIR: /data/debug
      SEARCH_PROFILE_MANIFEST_ROOT: /data/provider-manifests
      SEARCH_CHROME_PROFILE_DIR: /data/chrome-profile
      SEARCH_BING_PROFILE_DIR: /data/bing-profile
      SEARCH_BRAVE_PROFILE_DIR: /data/brave-profile
      SEARCH_READ_CHROME_PROFILE_DIR: /data/read-profile
      SEARCH_CHROME_PATH: /usr/bin/chromium
      SEARCH_CHROME_NO_SANDBOX: "true"
    ports:
      - "18080:8080"
    volumes:
      - search-trace-data:/data/trace
      - provider-profile-data:/data/provider-manifests
      - browser-profile-data:/data
    depends_on:
      trace-sqlite:
        condition: service_healthy
    restart: unless-stopped

  trace-sqlite:
    image: keinos/sqlite3:latest
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        mkdir -p /data/trace
        sqlite3 /data/trace/search-trace.db 'PRAGMA journal_mode=WAL; PRAGMA synchronous=FULL;'
        exec tail -f /dev/null
    volumes:
      - search-trace-data:/data/trace
    healthcheck:
      test: ["CMD-SHELL", "sqlite3 /data/trace/search-trace.db 'PRAGMA quick_check;' | grep -qx ok"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  search-trace-data:
  provider-profile-data:
  browser-profile-data:
